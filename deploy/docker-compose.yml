services:
  watchcat:
    image: holtye/watch-cat:latest
    container_name: watchcat
    restart: unless-stopped
    ports:
      - "3003:3003"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy

