{{define "toast"}}
<div x-data="toastManager()" @toast.window="add($event.detail)" class="fixed top-4 right-4 z-50 space-y-2 w-80">
    <template x-for="t in toasts" :key="t.id">
        <div x-show="t.visible"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 translate-x-4"
             x-transition:enter-end="opacity-100 translate-x-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 translate-x-0"
             x-transition:leave-end="opacity-0 translate-x-4"
             class="flex items-center gap-3 rounded-lg px-4 py-3 shadow-lg shadow-black/20 border"
             :class="t.type === 'success'
                 ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-300'
                 : 'bg-rose-500/10 border-rose-500/20 text-rose-300'">
            <!-- Icon -->
            <svg x-show="t.type === 'success'" class="h-5 w-5 shrink-0 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <svg x-show="t.type === 'error'" class="h-5 w-5 shrink-0 text-rose-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
            </svg>
            <span class="text-sm font-medium" x-text="t.message"></span>
            <button @click="remove(t.id)" class="ml-auto shrink-0 text-current opacity-50 hover:opacity-100">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </template>
</div>
<script>
    function toastManager() {
        return {
            toasts: [],
            nextId: 0,
            add(detail) {
                var id = this.nextId++;
                this.toasts.push({
                    id: id,
                    message: detail.message || '通知',
                    type: detail.type || 'success',
                    visible: true
                });
                var self = this;
                setTimeout(function() { self.remove(id); }, 3000);
            },
            remove(id) {
                var t = this.toasts.find(function(t) { return t.id === id; });
                if (t) t.visible = false;
                var self = this;
                setTimeout(function() {
                    self.toasts = self.toasts.filter(function(t) { return t.id !== id; });
                }, 200);
            }
        };
    }
</script>
{{end}}
