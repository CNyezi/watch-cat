<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} - {{end}}WatchCat 监控平台</title>

    <!-- Tailwind CSS (CDN only) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- htmx -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>window.htmx || document.write('<script src="/static/vendor/htmx.min.js"><\/script>')</script>

    <!-- htmx SSE extension -->
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <script>
        if (typeof htmx !== 'undefined' && !htmx.defineExtension.__sseLoaded) {
            try { htmx.findAll('[sse-connect]'); } catch(e) {
                document.write('<script src="/static/vendor/htmx-ext-sse.js"><\/script>');
            }
        }
    </script>

    <!-- SortableJS -->
    <script src="https://unpkg.com/sortablejs@1.15.6/Sortable.min.js"></script>
    <script>window.Sortable || document.write('<script src="/static/vendor/Sortable.min.js"><\/script>')</script>

    <!-- CodeMirror 6 (本地打包，避免 CDN 多实例问题) -->
    <script type="module" src="/static/js/cm-components.js"></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-full bg-slate-900" x-data="{ sidebarOpen: localStorage.getItem('sidebar') !== 'collapsed' }">

<!-- 侧边栏 -->
<aside :class="sidebarOpen ? 'w-56' : 'w-16'"
       class="fixed inset-y-0 left-0 z-40 flex flex-col bg-slate-950 border-r border-slate-800 transition-all duration-200">
    <!-- Logo 区域 h-12 -->
    <div class="flex h-12 items-center gap-2 px-4 border-b border-slate-800 shrink-0">
        <img src="/static/logo.svg" alt="WatchCat" class="h-7 w-7 shrink-0 rounded" />
        <span x-show="sidebarOpen" x-cloak class="text-sm font-semibold text-white truncate">WatchCat</span>
    </div>

    <!-- 导航菜单 -->
    <nav class="flex-1 py-4 space-y-1 px-2 overflow-y-auto">
        <!-- 仪表盘 -->
        <a href="/"
           class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm transition-colors {{if and .Nav (eq .Nav "dashboard")}}bg-slate-800 text-white border-l-2 border-indigo-500{{else}}text-slate-400 hover:bg-slate-800/50 hover:text-slate-200{{end}}"
           :class="sidebarOpen ? '' : 'justify-center'">
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25a2.25 2.25 0 0 1-2.25-2.25v-2.25Z"/>
            </svg>
            <span x-show="sidebarOpen" x-cloak>仪表盘</span>
        </a>
        <!-- 检测计划 -->
        <a href="/plans"
           class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm transition-colors {{if and .Nav (eq .Nav "plans")}}bg-slate-800 text-white border-l-2 border-indigo-500{{else}}text-slate-400 hover:bg-slate-800/50 hover:text-slate-200{{end}}"
           :class="sidebarOpen ? '' : 'justify-center'">
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z"/>
            </svg>
            <span x-show="sidebarOpen" x-cloak>检测计划</span>
        </a>
        <!-- 错误聚合 -->
        <a href="/errors"
           class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm transition-colors {{if and .Nav (eq .Nav "errors")}}bg-slate-800 text-white border-l-2 border-indigo-500{{else}}text-slate-400 hover:bg-slate-800/50 hover:text-slate-200{{end}}"
           :class="sidebarOpen ? '' : 'justify-center'">
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
            </svg>
            <span x-show="sidebarOpen" x-cloak>错误聚合</span>
        </a>
        <!-- 脚本库 -->
        <a href="/scripts"
           class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm transition-colors {{if and .Nav (eq .Nav "scripts")}}bg-slate-800 text-white border-l-2 border-indigo-500{{else}}text-slate-400 hover:bg-slate-800/50 hover:text-slate-200{{end}}"
           :class="sidebarOpen ? '' : 'justify-center'">
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5"/>
            </svg>
            <span x-show="sidebarOpen" x-cloak>脚本库</span>
        </a>
    </nav>

    <!-- 登出 -->
    <form method="POST" action="/logout" class="px-2 mb-1">
        <button type="submit"
                class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition-colors w-full"
                :class="sidebarOpen ? '' : 'justify-center'">
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/>
            </svg>
            <span x-show="sidebarOpen" x-cloak>登出</span>
        </button>
    </form>

    <!-- 折叠按钮 -->
    <button @click="sidebarOpen = !sidebarOpen; localStorage.setItem('sidebar', sidebarOpen ? 'open' : 'collapsed')"
            class="flex items-center justify-center border-t border-slate-800 p-3 text-slate-500 hover:text-slate-300 hover:bg-slate-800/50 transition-colors shrink-0">
        <svg x-show="sidebarOpen" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18.75 19.5l-7.5-7.5 7.5-7.5m-6 15L5.25 12l7.5-7.5"/>
        </svg>
        <svg x-show="!sidebarOpen" x-cloak class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 4.5l7.5 7.5-7.5 7.5m-6-15l7.5 7.5-7.5 7.5"/>
        </svg>
    </button>
</aside>

<!-- 移动端菜单按钮 -->
<div class="sm:hidden fixed top-3 left-3 z-50">
    <button @click="sidebarOpen = !sidebarOpen" type="button"
            class="rounded-lg bg-slate-800 p-2 text-slate-400 hover:text-white shadow-lg">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
        </svg>
    </button>
</div>

<!-- 主内容区 -->
<div :class="sidebarOpen ? 'ml-56' : 'ml-16'" class="min-h-screen transition-all duration-200 max-sm:ml-0">
    <!-- 面包屑 -->
    {{if .Breadcrumbs}}
    <div class="border-b border-slate-700 bg-slate-800/50">
        <div class="px-6">
            <nav class="flex py-3 text-sm text-slate-400" aria-label="Breadcrumb">
                <ol class="flex items-center space-x-2">
                    {{range $i, $bc := .Breadcrumbs}}
                    {{if $i}}<li class="text-slate-600">/</li>{{end}}
                    <li>
                        {{if $bc.URL}}
                        <a href="{{$bc.URL}}" class="hover:text-slate-200">{{$bc.Label}}</a>
                        {{else}}
                        <span class="text-slate-100 font-medium">{{$bc.Label}}</span>
                        {{end}}
                    </li>
                    {{end}}
                </ol>
            </nav>
        </div>
    </div>
    {{end}}

    <!-- 页面内容 -->
    <div class="px-6 py-6">
        {{template "content" .}}
    </div>
</div>

<!-- Toast -->
{{template "toast" .}}

<!-- JSON Viewer Modal -->
<div x-data="{ open: false, title: '', json: '' }"
     @show-json.window="title = $event.detail.title; json = $event.detail.json; open = true"
     @keydown.escape.window="open = false">
    <template x-if="open">
        <div class="fixed inset-0 z-50 flex items-center justify-center">
            <!-- Backdrop -->
            <div class="fixed inset-0 bg-black/60" @click="open = false"></div>
            <!-- Dialog -->
            <div class="relative w-full max-w-3xl max-h-[80vh] mx-4 flex flex-col rounded-lg bg-slate-800 shadow-xl ring-1 ring-slate-700">
                <!-- Header -->
                <div class="flex items-center justify-between px-5 py-3 border-b border-slate-700 shrink-0">
                    <h3 class="text-sm font-semibold text-slate-100" x-text="title"></h3>
                    <div class="flex items-center gap-2">
                        <button @click="navigator.clipboard.writeText(json).then(() => $dispatch('toast', { message: '已复制到剪贴板', type: 'success' }))"
                                class="inline-flex items-center gap-1 rounded px-2.5 py-1 text-xs font-medium text-slate-300 ring-1 ring-slate-600 hover:bg-slate-700 transition-colors">
                            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9.75a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184"/>
                            </svg>
                            复制
                        </button>
                        <button @click="open = false" class="rounded p-1 text-slate-400 hover:text-slate-200 hover:bg-slate-700 transition-colors">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <!-- Body -->
                <div class="flex-1 overflow-auto p-5">
                    <pre class="text-xs font-mono text-slate-300 whitespace-pre-wrap break-words" x-text="json"></pre>
                </div>
            </div>
        </div>
    </template>
</div>

<!-- Global htmx Error Listener -->
<script>
    document.addEventListener('htmx:responseError', function(event) {
        var status = event.detail.xhr ? event.detail.xhr.status : 0;
        var msg = '请求失败';
        if (status === 404) msg = '资源未找到';
        else if (status === 500) msg = '服务器内部错误';
        else if (status >= 400) msg = '请求错误 (' + status + ')';
        window.dispatchEvent(new CustomEvent('toast', {
            detail: { message: msg, type: 'error' }
        }));
    });

    document.addEventListener('htmx:sendError', function() {
        window.dispatchEvent(new CustomEvent('toast', {
            detail: { message: '网络错误，请检查您的连接', type: 'error' }
        }));
    });
</script>

<!-- Alpine.js: 必须在所有组件 <script> 之后加载，确保 planDetail/toastManager 等函数已定义 -->
<script src="/static/vendor/alpine.min.js"></script>

</body>
</html>
